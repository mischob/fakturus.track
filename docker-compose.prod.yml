version: '3.8'

networks:
  proxy:
    external: true
  fakturus-internal:
    driver: bridge

services:
  fakturus-track-api:
    image: registry.fakturus.com/fakturus-track-api:latest
    container_name: fakturus-track-api
    restart: unless-stopped
    ports:
      - 8082:80
    networks:
      - proxy
      - fakturus-internal
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - KeyVault__VaultUrl=https://fakturus.vault.azure.net/
      - AzureAdB2C__Instance=https://fakturus.b2clogin.com/
      - AzureAdB2C__Domain=fakturus.onmicrosoft.com
      - AzureAdB2C__TenantId=17c44991-367b-4d16-b818-1c268d2faed5
      - AzureAdB2C__ClientId=74fd0ed2-8865-4bad-b002-7d867ad8791a
      - AzureAdB2C__Audience=74fd0ed2-8865-4bad-b002-7d867ad8791a
      - AzureAdB2C__SignUpSignInPolicyId=B2C_1_fakt_sign_in
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fakturus-track-api.rule=Host(`api.track.fakturus.com`)"
      - "traefik.http.routers.fakturus-track-api.entrypoints=https"
      - "traefik.http.routers.fakturus-track-api.tls=true"
      - "traefik.http.routers.fakturus-track-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.fakturus-track-api.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  fakturus-track-webapp:
    image: registry.fakturus.com/fakturus-track-webapp:latest
    container_name: fakturus-track-webapp
    restart: unless-stopped
    ports:
      - 8092:80
    networks:
      - proxy
      - fakturus-internal
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ApiSettings__BaseUrl=http://fakturus-track-api:80
      - AzureAdB2C__Instance=https://fakturus.b2clogin.com/
      - AzureAdB2C__Domain=fakturus.onmicrosoft.com
      - AzureAdB2C__TenantId=17c44991-367b-4d16-b818-1c268d2faed5
      - AzureAdB2C__ClientId=3fb35bc6-8825-495e-b0a2-18e00352f968
      - AzureAdB2C__CallbackPath=/signin-oidc
      - AzureAdB2C__SignedOutCallbackPath=/signout-callback-oidc
      - AzureAdB2C__SignUpSignInPolicyId=B2C_1_BetaSignInOnly
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fakturus-track-webapp.rule=Host(`track.fakturus.com`)"
      - "traefik.http.routers.fakturus-track-webapp.entrypoints=https"
      - "traefik.http.routers.fakturus-track-webapp.tls=true"
      - "traefik.http.routers.fakturus-track-webapp.tls.certresolver=letsencrypt"
      - "traefik.http.services.fakturus-track-webapp.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      fakturus-track-api:
        condition: service_healthy
