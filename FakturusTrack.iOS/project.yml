name: FakturusTrack
options:
  bundleIdPrefix: com.fakturus
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1

packages:
  MSAL:
    url: https://github.com/AzureAD/microsoft-authentication-library-for-objc
    from: "1.5.0"

targets:
  FakturusTrack:
    type: application
    platform: iOS
    sources:
      - path: FakturusTrack
        excludes:
          - "**/.gitkeep"
    info:
      path: FakturusTrack/Info.plist
      properties:
        CFBundleDisplayName: "Fakturus Track"
        CFBundleName: "FakturusTrack"
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "msauth.com.fakturus.track"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - fetch
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSApplicationQueriesSchemes:
          - msauthv2
          - msauthv3
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fakturus.track
        CODE_SIGN_ENTITLEMENTS: FakturusTrack/FakturusTrack.entitlements
    dependencies:
      - package: MSAL
      - target: FakturusTrackWidget
    entitlements:
      path: FakturusTrack/FakturusTrack.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.fakturus.track
        com.apple.security.application-groups:
          - group.com.fakturus.track

  FakturusTrackWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FakturusTrackWidget
        excludes:
          - "**/.gitkeep"
      - path: FakturusTrack/Shared/SharedDefaults.swift
      - path: FakturusTrackWidget/Resources
    info:
      path: FakturusTrackWidget/Info.plist
      properties:
        CFBundleDisplayName: "Fakturus Track Widget"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fakturus.track.widget
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: FakturusTrackWidget/FakturusTrackWidget.entitlements
    entitlements:
      path: FakturusTrackWidget/FakturusTrackWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fakturus.track

  FakturusTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FakturusTrackTests
    dependencies:
      - target: FakturusTrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fakturus.track.tests
